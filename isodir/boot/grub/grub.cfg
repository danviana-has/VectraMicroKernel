serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

set timeout=0
set default=0

menuentry "Vectra OS (kernel.akl)" {
    multiboot /boot/kernel.akl
    module /apps/shell.bin shell.bin
    module /apps/hello.bin hello.bin
    module /apps/downloadfile.bin downloadfile.bin
    module /apps/notepad.bin notepad.bin
    boot
}
